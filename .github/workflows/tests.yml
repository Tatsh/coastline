---
concurrency:
  cancel-in-progress: true
  group: tests-${{ github.ref }}
jobs:
  tests:
    env:
      CCACHE_DIR: '${{ github.workspace }}/.wiswa-ci/ccache-tests'
      CMAKE_C_COMPILER_LAUNCHER: 'ccache'
      CMAKE_CXX_COMPILER_LAUNCHER: 'ccache'
    name: 'Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - id: 'test-build-cache'
        name: 'Restore test compiler cache'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: 'tests-ccache-${{ runner.os }}-${{ github.sha }}'
          path: '.wiswa-ci/ccache-tests'
          restore-keys: 'tests-ccache-${{ runner.os }}-'
      # The tests build the reconstructed C for the host with the host compiler, so no cross
      # toolchain is needed.
      - name: 'Install the tools'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache cmake ninja-build zlib1g-dev
          ccache --max-size=500M
      - name: 'Configure, build and test'
        run: cmake --workflow --preset tests
      - if: >-
          !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.test-build-cache.outputs.cache-hit != 'true'
        name: 'Save test compiler cache'
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: 'tests-ccache-${{ runner.os }}-${{ github.sha }}'
          path: '.wiswa-ci/ccache-tests'
name: 'Tests'
'on':
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
permissions:
  contents: read
