---
concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}
jobs:
  version:
    name: 'Package version'
    outputs:
      version: '${{ steps.version.outputs.version }}'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: 'version'
        name: 'Select the tag or seven-character SHA'
        run: |
          version="${GITHUB_SHA:0:7}"
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            version="v${tag#v}"
            version="${version//\//-}"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
  n64:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'Nintendo 64 (${{ matrix.region_name }})'
    needs: 'version'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ['us', 'jp', 'eu', 'asia']
        include:
          - region: 'us'
            region_name: 'US ROM'
          - region: 'jp'
            region_name: 'Japan ROM'
          - region: 'eu'
            region_name: 'Europe ROM'
          - region: 'asia'
            region_name: 'Asia ROM'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The compiler is libdragon's GCC. No other part of libdragon is used, and the package is
      # pinned by digest.
      - name: 'Install the toolchain'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
          curl -sSL -o gcc-toolchain-mips64-x86_64.deb \
            https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          echo 'fac8e6572493a66468b7d45df41b042f90b1a630ec96aa218bd5fb1f320a0a4d  gcc-toolchain-mips64-x86_64.deb' \
            | sha256sum -c
          sudo apt-get install -y ./gcc-toolchain-mips64-x86_64.deb
      - name: 'Toolchain versions'
        run: |
          /opt/libdragon/bin/mips64-elf-gcc --version
          cmake --version
      - name: 'Configure'
        run: cmake --preset "n64-$TGR_REGION" -DCMAKE_BUILD_TYPE=Release -DTGR_ENABLE_PATCHES=ON
        env:
          N64_INST: '/opt/libdragon'
          TGR_REGION: '${{ matrix.region }}'
      - name: 'Compile'
        run: cmake --build --preset "n64-$TGR_REGION" -- -k 0
        env:
          TGR_REGION: '${{ matrix.region }}'
      # Without a cartridge image the build links neither the program nor the cartridge, only the
      # archives of the routines.
      - name: 'Version the archive filenames'
        run: |
          while IFS= read -r -d '' archive; do
            relative="${archive#build/n64-"$TGR_REGION"/src/}"
            destination="artifacts/${relative%.a}-$VERSION.a"
            mkdir -p "${destination%/*}"
            cp "$archive" "$destination"
          done < <(find "build/n64-$TGR_REGION/src" -type f -name '*.a' -print0)
        env:
          TGR_REGION: '${{ matrix.region }}'
          VERSION: '${{ needs.version.outputs.version }}'
      - name: 'Attest the archives'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'artifacts/**/*.a'
      - name: 'Upload the archives'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'tgr-${{ matrix.region }}-Release'
          path: 'artifacts/**/*.a'
  n64-matching:
    name: 'Nintendo 64 matching (${{ matrix.region_name }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ['us', 'jp', 'eu', 'asia']
        include:
          - region: 'us'
            region_name: 'US ROM'
          - region: 'jp'
            region_name: 'Japan ROM'
          - region: 'eu'
            region_name: 'Europe ROM'
          - region: 'asia'
            region_name: 'Asia ROM'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install the toolchains'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
          curl -sSL -o gcc-toolchain-mips64-x86_64.deb \
            https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          echo 'fac8e6572493a66468b7d45df41b042f90b1a630ec96aa218bd5fb1f320a0a4d  gcc-toolchain-mips64-x86_64.deb' \
            | sha256sum -c
          sudo apt-get install -y ./gcc-toolchain-mips64-x86_64.deb
          mkdir -p .wiswa-ci/ido/5.3
          curl -sSL -o .wiswa-ci/ido-5.3.tar.gz \
            https://github.com/decompals/ido-static-recomp/releases/download/v1.2/ido-5.3-recomp-linux.tar.gz
          echo 'ab5c741561f80913d58c8b074771f23941a3edd312505a8ebed6d1dfeb65e506  .wiswa-ci/ido-5.3.tar.gz' \
            | sha256sum -c
          tar -xf .wiswa-ci/ido-5.3.tar.gz -C .wiswa-ci/ido/5.3
      - name: 'Compile and verify the IDO Release code image'
        run: |
          cmake -S . -B ".wiswa-ci/build/ido-$TGR_REGION" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/n64-ido-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DTGR_PLATFORM=n64 -DTGR_REGION="$TGR_REGION" \
            -DTGR_ENABLE_PATCHES=OFF -DIDO_ROOT="$IDO_ROOT"
          cmake --build ".wiswa-ci/build/ido-$TGR_REGION" --target rom --parallel 4
        env:
          IDO_ROOT: '${{ github.workspace }}/.wiswa-ci/ido/5.3'
          N64_INST: '/opt/libdragon'
          TGR_REGION: '${{ matrix.region }}'
  sdl:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'SDL (${{ matrix.platform.name }})'
    needs: 'version'
    runs-on: '${{ matrix.platform.os }}'
    strategy:
      fail-fast: false
      matrix:
        platform:
          # linuxdeploy builds the AppImage, and its checksum is that of the pinned release.
          - architecture: 'x86_64'
            linuxdeploy-sha256: 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
            name: 'Linux x86_64'
            os: 'ubuntu-latest'
            slug: 'linux-x86_64'
          - architecture: 'arm64'
            linuxdeploy-sha256: '620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff'
            name: 'Linux arm64'
            os: 'ubuntu-24.04-arm'
            slug: 'linux-arm64'
          # MSVC of Visual Studio 2022 is the oldest that compiles C++23, and the game targets
          # Windows 7, the oldest SDL 3 runs on.
          - architecture: 'x64'
            name: 'Windows x64'
            os: 'windows-2022'
            slug: 'windows-x64'
          - architecture: 'arm64'
            name: 'Windows arm64'
            os: 'windows-11-arm'
            slug: 'windows-arm64'
          # The Apple silicon runner also builds for Intel Macs, from 10.15, the oldest macOS
          # whose C++ library has std::filesystem.
          - architecture: 'arm64'
            name: 'macOS arm64'
            os: 'macos-latest'
            slug: 'macos-arm64'
            triplet: 'arm64-osx'
          - architecture: 'x86_64'
            name: 'macOS x86_64'
            os: 'macos-latest'
            slug: 'macos-x86_64'
            triplet: 'x64-osx'
    env:
      # Each package filename includes a version tag or the seven-character commit SHA.
      PACKAGE: 'coastline-${{ needs.version.outputs.version }}-${{ matrix.platform.slug }}-Release'
      BUILD_TYPE: 'Release'
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      VCPKG_KEEP_ENV_VARS: 'MACOSX_DEPLOYMENT_TARGET'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.wiswa-ci/vcpkg-cache,readwrite'
      VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Prepare the vcpkg binary cache'
        run: mkdir -p .wiswa-ci/vcpkg-cache
        shell: bash
      - if: github.ref_type != 'tag'
        id: 'vcpkg-cache'
        name: 'Restore vcpkg binaries'
        uses: 'actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830'
        with:
          key: "vcpkg-${{ runner.os }}-${{ matrix.platform.slug }}-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      # The vcpkg build of SDL needs the development headers of ALSA, EGL, Wayland, xkbcommon, and
      # the X11 extensions, and autoconf-archive.
      - if: runner.os == 'Linux'
        name: 'Install the tools'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf-archive cmake libasound2-dev libegl1-mesa-dev \
            libltdl-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev nasm ninja-build \
            pkg-config wayland-protocols
      - if: runner.os == 'macOS'
        name: 'Install the tools'
        run: brew install librsvg nasm ninja
      # The baseline of vcpkg-configuration.json pins the versions of the ports.
      # The workflow also builds tags, so the packages vcpkg builds are not cached.
      - name: 'Install vcpkg'
        run: git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
        shell: bash
      - if: runner.os == 'Linux'
        name: 'Configure and compile'
        run: |
          cmake --preset sdl -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCOASTLINE_PORTABLE=ON \
            -DCOASTLINE_DISCORD=ON '-DVCPKG_MANIFEST_FEATURES=sdl;video'
          cmake --build --preset sdl -- -k 0
      - if: runner.os == 'macOS'
        name: 'Configure and compile'
        run: |
          cmake --preset sdl -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCOASTLINE_PORTABLE=ON \
            -DCOASTLINE_DISCORD=ON '-DVCPKG_MANIFEST_FEATURES=sdl;video' \
            -DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURE" -DVCPKG_TARGET_TRIPLET="$TRIPLET"
          cmake --build --preset sdl -- -k 0
        env:
          ARCHITECTURE: '${{ matrix.platform.architecture }}'
          TRIPLET: '${{ matrix.platform.triplet }}'
      # Ninja finds MSVC in the environment the developer command prompt sets up for the
      # architecture of the runner.
      - if: runner.os == 'Windows'
        name: 'Configure and compile'
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $studio = & $installer -latest -property installationPath
          Import-Module "$studio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $studio -SkipAutomaticLocation `
            -DevCmdArguments "-arch=$env:ARCHITECTURE -host_arch=$env:ARCHITECTURE"
          cmake --preset sdl -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" -DCOASTLINE_PORTABLE=ON `
            -DCOASTLINE_DISCORD=ON '-DVCPKG_MANIFEST_FEATURES=sdl;video'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset sdl -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          ARCHITECTURE: '${{ matrix.platform.architecture }}'
        shell: pwsh
      - if: >-
          !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.vcpkg-cache.outputs.cache-hit != 'true'
        name: 'Save vcpkg binaries'
        uses: 'actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830'
        with:
          key: "vcpkg-${{ runner.os }}-${{ matrix.platform.slug }}-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Install'
        run: cmake --install build/sdl --prefix staging --strip
        shell: bash
      # Each package keeps the permissions of the files, which an artifact loses: a tarball on
      # Linux, and on macOS a disk image, which also keeps the signature of the bundle.
      - if: runner.os == 'Linux'
        name: 'Package'
        run: tar -C staging -czf "$PACKAGE.tar.gz" .
      - if: runner.os == 'macOS'
        name: 'Package'
        run: |
          codesign --verify --deep --strict staging/Coastline.app
          mkdir dmg-root
          ditto staging/Coastline.app dmg-root/Coastline.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Coastline -srcfolder dmg-root -ov -format UDZO \
            "$PACKAGE.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint dmg-check "$PACKAGE.dmg"
          test -d dmg-check/Coastline.app
          test "$(readlink dmg-check/Applications)" = /Applications
          codesign --verify --deep --strict dmg-check/Coastline.app
          hdiutil detach dmg-check
      - if: runner.os == 'Windows'
        name: 'Verify installed runtime'
        run: |
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            & .\staging\bin\coastline.exe --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $originalPath
          }
        shell: pwsh
      - if: runner.os == 'Windows'
        name: 'Package'
        # A relative Unicode link avoids embedding the build runner's staging directory.
        run: |
          $link = [IO.BinaryWriter]::new([IO.File]::Create((Join-Path $PWD 'staging/Coastline.lnk')))
          try {
            $link.Write([uint32]0x4c)
            $link.Write(([Guid]'00021401-0000-0000-C000-000000000046').ToByteArray())
            $link.Write([uint32]0x88)
            $link.Write([uint32]0x20)
            $link.Write([byte[]]::new(28))
            $link.Write([int32]0)
            $link.Write([uint32]1)
            $link.Write([byte[]]::new(12))
            $target = 'bin\coastline.exe'
            $link.Write([uint16]$target.Length)
            $link.Write([Text.Encoding]::Unicode.GetBytes($target))
            $link.Write([uint32]0)
          } finally {
            $link.Dispose()
          }
          Compress-Archive -Path staging\* -DestinationPath "$env:PACKAGE.zip"
        shell: pwsh
      # NSIS is on the x64 runner but not always on the arm64 runner.
      - if: runner.os == 'Windows'
        name: 'Build the installer'
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          $env:PATH = "$nsis;$env:PATH"
          cpack --config build/sdl/CPackConfig.cmake -B . `
            -D "CPACK_PACKAGE_FILE_NAME=$env:PACKAGE-setup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: 'Attest the game packages'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            coastline-*.dmg
            coastline-*.exe
            coastline-*.tar.gz
            coastline-*.zip
      - name: 'Upload the game'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-${{ matrix.platform.slug }}-Release'
          path: |
            coastline-*.dmg
            coastline-*.exe
            coastline-*.tar.gz
            coastline-*.zip
      # The AppImage bundles the libraries the game links, and SDL opens those of the system for
      # the display, the GPU, and the sound.
      - if: runner.os == 'Linux'
        name: 'Build the AppImage'
        run: |
          arch="$(uname -m)"
          curl -sSL -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$arch.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy.AppImage" | sha256sum -c
          chmod +x linuxdeploy.AppImage
          DESTDIR=AppDir cmake --install build/sdl --prefix /usr --strip
          cp AppDir/usr/share/metainfo/sh.tat.coastline.metainfo.xml \
            AppDir/usr/share/metainfo/sh.tat.coastline.appdata.xml
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage --appdir AppDir \
            --desktop-file=AppDir/usr/share/applications/sh.tat.coastline.desktop --output appimage
        env:
          LDAI_OUTPUT: 'Coastline-${{ needs.version.outputs.version }}-${{ matrix.platform.slug }}-Release.AppImage'
          LINUXDEPLOY_OUTPUT_VERSION: '${{ needs.version.outputs.version }}'
          LINUXDEPLOY_SHA256: '${{ matrix.platform.linuxdeploy-sha256 }}'
      - if: runner.os == 'Linux' && github.event_name != 'pull_request'
        name: 'Attest the AppImage'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'Coastline-${{ needs.version.outputs.version }}-${{ matrix.platform.slug }}-Release.AppImage'
      - if: runner.os == 'Linux'
        name: 'Upload the AppImage'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-appimage-${{ matrix.platform.architecture }}-Release'
          path: 'Coastline-${{ needs.version.outputs.version }}-${{ matrix.platform.slug }}-Release.AppImage'
  flatpak:
    permissions:
      attestations: write
      contents: read
      id-token: write
    container:
      image: 'ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae'
      options: '--privileged'
    name: 'Flatpak (${{ matrix.arch }})'
    needs: 'version'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'x86_64'
            os: 'ubuntu-latest'
          - arch: 'aarch64'
            os: 'ubuntu-24.04-arm'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The action uploads the bundle as an artifact.
      - uses: 'flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3'
        with:
          arch: '${{ matrix.arch }}'
          artifact-name: 'coastline-flatpak-${{ matrix.arch }}'
          bundle: 'sh.tat.coastline-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak'
          cache: false
          manifest-path: 'sh.tat.coastline.yml'
      - name: 'Attest the Flatpak'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'sh.tat.coastline-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak'
  snap:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'Snap (${{ matrix.name }})'
    needs: 'version'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'amd64'
            os: 'ubuntu-latest'
          - name: 'arm64'
            os: 'ubuntu-24.04-arm'
    steps:
      # The version of the snap is the description of the commit by its tags.
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: 'snap'
        uses: 'snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79'
      - name: 'Version the snap filename'
        run: |
          name="coastline_${VERSION}_${ARCH}.snap"
          [[ "$SNAP_FILE" == "$name" ]] || mv "$SNAP_FILE" "$name"
          echo "SNAP_FILE=$name" >> "$GITHUB_ENV"
        env:
          ARCH: '${{ matrix.name }}'
          SNAP_FILE: '${{ steps.snap.outputs.snap }}'
          VERSION: '${{ needs.version.outputs.version }}'
      - name: 'Attest the snap'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: '${{ env.SNAP_FILE }}'
      - name: 'Upload the snap'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-snap-${{ matrix.name }}'
          path: '${{ env.SNAP_FILE }}'
  sdl-mingw:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'SDL (Windows x64 MinGW)'
    needs: 'version'
    runs-on: windows-2022
    env:
      PACKAGE: 'coastline-${{ needs.version.outputs.version }}-windows-x64-mingw-Release'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.wiswa-ci/vcpkg-cache,readwrite'
      VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
    steps:
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'git zip'
          msystem: 'ucrt64'
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p
          update: true
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Prepare the vcpkg binary cache'
        run: mkdir -p .wiswa-ci/vcpkg-cache
        shell: 'msys2 {0}'
      - if: github.ref_type != 'tag'
        id: 'vcpkg-cache'
        name: 'Restore vcpkg binaries'
        uses: 'actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830'
        with:
          key: "vcpkg-${{ runner.os }}-windows-x64-ucrt-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Configure and compile'
        run: |
          git clone https://github.com/microsoft/vcpkg .vcpkg
          cmake --preset sdl -DCMAKE_BUILD_TYPE=Release -DCOASTLINE_PORTABLE=ON \
            -DCOASTLINE_VIDEO=OFF -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic \
            -DVCPKG_HOST_TRIPLET=x64-mingw-dynamic \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          cmake --build --preset sdl -- -k 0
        shell: 'msys2 {0}'
      - if: >-
          !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.vcpkg-cache.outputs.cache-hit != 'true'
        name: 'Save vcpkg binaries'
        uses: 'actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830'
        with:
          key: "vcpkg-${{ runner.os }}-windows-x64-ucrt-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Package'
        run: |
          cmake --install build/sdl --prefix staging --strip
          ./staging/bin/coastline.exe --help
          cd staging
          zip -r -9 "../$PACKAGE.zip" .
        shell: 'msys2 {0}'
      - name: 'Attest the game package'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: '${{ env.PACKAGE }}.zip'
      - name: 'Upload the game'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-windows-x64-mingw-Release'
          path: '${{ env.PACKAGE }}.zip'
  win:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'Windows (Boss Rally)'
    needs: 'version'
    runs-on: windows-latest
    steps:
      # The compiler is the i686 mingw-w64 GCC of MSYS2's mingw32 system.
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'git zip'
          msystem: 'mingw32'
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p
          update: true
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Toolchain versions'
        run: |
          i686-w64-mingw32-gcc --version
          cmake --version
        shell: 'msys2 {0}'
      - name: 'Configure'
        run: cmake --preset win-both -DTGR_ENABLE_PATCHES=ON
        shell: 'msys2 {0}'
      - name: 'Compile'
        run: cmake --build --preset win-both -- -k 0
        shell: 'msys2 {0}'
      # The renderer library, earpds.dll, and the launchers go side by side, as in the installed
      # game.
      - name: 'Package'
        run: |
          mkdir staging
          cp build/win-both/win-d3d/src/BRD3D.dll build/win-both/win-glide/src/BRGlide.dll \
            build/win-both/win-d3d/src/win32/ear/earpds.dll \
            build/win-both/win-d3d/src/win32/boot/*.exe staging/
          (cd staging && zip -9 "../coastline-$VERSION-br-Release.zip" ./*)
          unzip -l ./coastline-*.zip
        env:
          VERSION: '${{ needs.version.outputs.version }}'
        shell: 'msys2 {0}'
      - name: 'Attest the binaries'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'coastline-*.zip'
      - name: 'Upload the binaries'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'br-windows-Release'
          path: 'coastline-*.zip'
  win-msvc:
    name: 'Windows (Boss Rally, MSVC)'
    runs-on: windows-2022
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          repository: 'NovaRain/DXSDK_Collection'
          ref: '61827822ad945fac5acb3123ab00c378654bfcd7'
          path: 'dxsdk'
          sparse-checkout: |
            DXSDK_Aug2007/Include
            DXSDK_Aug2007/Lib/x86
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 'Install the resource compiler'
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --noconfirm mingw-w64-i686-binutils'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw32\bin'
      - name: 'Configure'
        run: >-
          cmake -S . -B build/win-msvc -G 'Visual Studio 17 2022' -A Win32
          '-DTGR_VARIANTS=win-d3d;win-glide' -DTGR_ENABLE_PATCHES=ON
          "-DDXSDK_DIR=$env:GITHUB_WORKSPACE/dxsdk/DXSDK_Aug2007"
      - name: 'Compile'
        run: cmake --build build/win-msvc --config Release --parallel 4
  # On a tag, PC packages go to the draft. N64 artifacts remain on the CI run.
  # The Release workflow publishes the draft once every workflow of the commit succeeds.
  release:
    if: "github.ref_type == 'tag'"
    name: 'Attach to the release'
    needs: ['flatpak', 'n64', 'sdl', 'sdl-mingw', 'snap', 'win']
    permissions:
      attestations: 'write'
      contents: 'write'
      id-token: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333'
        with:
          merge-multiple: true
          path: 'packages'
          pattern: >-
            {coastline-{linux,windows,macos,appimage}-*-Release,br-*-Release,coastline-{flatpak,snap}-*}
      - name: 'List the packages'
        run: |
          find packages -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \
            -o -name '*.flatpak' -o -name '*.snap' -o -name '*.tar.gz' -o -name '*.zip' \) \
            | sort > packages.txt
          cat packages.txt
      - uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            packages/*.AppImage
            packages/*.dmg
            packages/*.exe
            packages/*.flatpak
            packages/*.snap
            packages/*.tar.gz
            packages/*.zip
      - env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        name: 'Upload to the draft release'
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --notes '' --title "$TAG" --verify-tag
          xargs -d '\n' gh release upload "$TAG" --clobber < packages.txt
name: 'Build'
'on':
  push:
    branches: ['master']
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ['master']
permissions:
  contents: read
