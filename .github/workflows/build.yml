---
concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}
jobs:
  n64:
    name: 'Nintendo 64 (${{ matrix.region }}, ${{ matrix.build-type }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ['Debug', 'Release']
        region: ['us', 'jp', 'eu']
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The compiler is libdragon's GCC. No other part of libdragon is used, and the package is
      # pinned by digest.
      - name: 'Install the toolchain'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
          curl -sSL -o gcc-toolchain-mips64-x86_64.deb \
            https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          echo 'fac8e6572493a66468b7d45df41b042f90b1a630ec96aa218bd5fb1f320a0a4d  gcc-toolchain-mips64-x86_64.deb' \
            | sha256sum -c
          sudo apt-get install -y ./gcc-toolchain-mips64-x86_64.deb
      - name: 'Toolchain versions'
        run: |
          /opt/libdragon/bin/mips64-elf-gcc --version
          cmake --version
      - name: 'Configure'
        run: cmake --preset "n64-$TGR_REGION" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DTGR_ENABLE_PATCHES=ON
        env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          N64_INST: '/opt/libdragon'
          TGR_REGION: '${{ matrix.region }}'
      - name: 'Compile'
        run: cmake --build --preset "n64-$TGR_REGION" -- -k 0
        env:
          TGR_REGION: '${{ matrix.region }}'
      # Without a cartridge image the build links neither the program nor the cartridge, only the
      # archives of the routines.
      - name: 'Upload the archives'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'n64-${{ matrix.region }}-${{ matrix.build-type }}'
          path: 'build/n64-${{ matrix.region }}/src/**/*.a'
  sdl:
    name: 'SDL (${{ matrix.platform.name }}, ${{ matrix.build-type }})'
    runs-on: '${{ matrix.platform.os }}'
    strategy:
      fail-fast: false
      matrix:
        build-type: ['Debug', 'Release']
        platform:
          # linuxdeploy builds the AppImage, and its checksum is that of the pinned release.
          - linuxdeploy-sha256: 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
            name: 'Linux x86_64'
            os: 'ubuntu-latest'
          - linuxdeploy-sha256: '620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff'
            name: 'Linux arm64'
            os: 'ubuntu-24.04-arm'
          # MSVC of Visual Studio 2022 is the oldest that compiles C++23, and the game targets
          # Windows 7, the oldest SDL 3 runs on.
          - architecture: 'x64'
            name: 'Windows x64'
            os: 'windows-2022'
          - architecture: 'arm64'
            name: 'Windows arm64'
            os: 'windows-11-arm'
          # The Apple silicon runner also builds for Intel Macs, from 10.15, the oldest macOS
          # whose C++ library has std::filesystem.
          - architecture: 'arm64'
            name: 'macOS arm64'
            os: 'macos-latest'
            triplet: 'arm64-osx'
          - architecture: 'x86_64'
            name: 'macOS x86_64'
            os: 'macos-latest'
            triplet: 'x64-osx'
    env:
      BUILD_TYPE: '${{ matrix.build-type }}'
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      VCPKG_KEEP_ENV_VARS: 'MACOSX_DEPLOYMENT_TARGET'
      VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The vcpkg build of SDL needs the development headers of ALSA, EGL, Wayland, xkbcommon, and
      # the X11 extensions, and autoconf-archive.
      - if: runner.os == 'Linux'
        name: 'Install the tools'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf-archive cmake libasound2-dev libegl1-mesa-dev \
            libltdl-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev ninja-build \
            pkg-config wayland-protocols
      - if: runner.os == 'macOS'
        name: 'Install the tools'
        run: brew install librsvg ninja
      # The baseline of vcpkg-configuration.json pins the versions of the ports.
      # The workflow also builds tags, so the packages vcpkg builds are not cached.
      - name: 'Install vcpkg'
        run: git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
        shell: bash
      - if: runner.os == 'Linux'
        name: 'Configure and compile'
        run: |
          cmake --preset sdl -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          cmake --build --preset sdl -- -k 0
      - if: runner.os == 'macOS'
        name: 'Configure and compile'
        run: |
          cmake --preset sdl -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURE" -DVCPKG_TARGET_TRIPLET="$TRIPLET"
          cmake --build --preset sdl -- -k 0
        env:
          ARCHITECTURE: '${{ matrix.platform.architecture }}'
          TRIPLET: '${{ matrix.platform.triplet }}'
      # Ninja finds MSVC in the environment the developer command prompt sets up for the
      # architecture of the runner.
      - if: runner.os == 'Windows'
        name: 'Configure and compile'
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $studio = & $installer -latest -property installationPath
          Import-Module "$studio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $studio -SkipAutomaticLocation `
            -DevCmdArguments "-arch=$env:ARCHITECTURE -host_arch=$env:ARCHITECTURE"
          cmake --preset sdl -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset sdl -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          ARCHITECTURE: '${{ matrix.platform.architecture }}'
        shell: pwsh
      # The debug build retains its symbols, and the release build is stripped.
      - name: 'Install'
        run: |
          if [ "$BUILD_TYPE" = 'Release' ]; then strip='--strip'; else strip=''; fi
          cmake --install build/sdl --prefix staging $strip
        shell: bash
      - if: runner.os != 'macOS'
        name: 'Upload the game'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'sdl-${{ matrix.platform.name }}-${{ matrix.build-type }}'
          path: 'staging'
      # A disk image keeps the permissions and the signature of the bundle, which an artifact loses.
      - if: runner.os == 'macOS'
        name: 'Build the disk image'
        run: |
          codesign --verify --deep --strict staging/Coastline.app
          hdiutil create -volname Coastline -srcfolder staging/Coastline.app -ov -format UDZO \
            "Coastline-$ARCHITECTURE-$BUILD_TYPE.dmg"
        env:
          ARCHITECTURE: '${{ matrix.platform.architecture }}'
      - if: runner.os == 'macOS'
        name: 'Upload the disk image'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'sdl-${{ matrix.platform.name }}-${{ matrix.build-type }}'
          path: '*.dmg'
      # The AppImage bundles the libraries the game links, and SDL opens those of the system for
      # the display, the GPU, and the sound.
      - if: runner.os == 'Linux' && matrix.build-type == 'Release'
        name: 'Build the AppImage'
        run: |
          arch="$(uname -m)"
          curl -sSL -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$arch.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy.AppImage" | sha256sum -c
          chmod +x linuxdeploy.AppImage
          DESTDIR=AppDir cmake --install build/sdl --prefix /usr --strip
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage --appdir AppDir --output appimage
        env:
          LINUXDEPLOY_SHA256: '${{ matrix.platform.linuxdeploy-sha256 }}'
      - if: runner.os == 'Linux' && matrix.build-type == 'Release'
        name: 'Upload the AppImage'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'appimage-${{ matrix.platform.name }}'
          path: '*.AppImage'
  flatpak:
    container:
      image: 'ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08'
      options: '--privileged'
    name: 'Flatpak (${{ matrix.arch }})'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'x86_64'
            os: 'ubuntu-latest'
          - arch: 'aarch64'
            os: 'ubuntu-24.04-arm'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The action uploads the bundle as an artifact.
      - uses: 'flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3'
        with:
          arch: '${{ matrix.arch }}'
          artifact-name: 'flatpak-${{ matrix.arch }}'
          bundle: 'coastline-${{ matrix.arch }}.flatpak'
          cache: false
          manifest-path: 'flatpak/sh.tat.coastline.yml'
  snap:
    name: 'Snap (${{ matrix.name }})'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'amd64'
            os: 'ubuntu-latest'
          - name: 'arm64'
            os: 'ubuntu-24.04-arm'
    steps:
      # The version of the snap is the description of the commit by its tags.
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: 'snap'
        uses: 'snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79'
      - name: 'Upload the snap'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'snap-${{ matrix.name }}'
          path: '${{ steps.snap.outputs.snap }}'
  win:
    name: 'Windows (${{ matrix.renderer }}, ${{ matrix.build-type }})'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ['Debug', 'Release']
        renderer: ['d3d', 'glide']
    steps:
      # The compiler is the i686 mingw-w64 GCC of MSYS2's mingw32 system.
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'git'
          msystem: 'mingw32'
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p
          update: true
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Toolchain versions'
        run: |
          i686-w64-mingw32-gcc --version
          cmake --version
        shell: 'msys2 {0}'
      - name: 'Configure'
        run: cmake --preset "win-$TGR_RENDERER" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DTGR_ENABLE_PATCHES=ON
        env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          TGR_RENDERER: '${{ matrix.renderer }}'
        shell: 'msys2 {0}'
      - name: 'Compile'
        run: cmake --build --preset "win-$TGR_RENDERER" -- -k 0
        env:
          TGR_RENDERER: '${{ matrix.renderer }}'
        shell: 'msys2 {0}'
      # The renderer library, earpds.dll, and the launchers go side by side, as in the installed
      # game.
      - name: 'Collect the binaries'
        run: |
          mkdir staging
          cp "build/win-$TGR_RENDERER/src/"*.dll "build/win-$TGR_RENDERER/src/win32/ear/earpds.dll" \
            "build/win-$TGR_RENDERER/src/win32/boot/"*.exe staging/
          ls -l staging
        env:
          TGR_RENDERER: '${{ matrix.renderer }}'
        shell: 'msys2 {0}'
      - name: 'Upload the binaries'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'win-${{ matrix.renderer }}-${{ matrix.build-type }}'
          path: 'staging'
name: 'Build'
'on':
  push:
    branches: ['master']
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ['master']
permissions:
  contents: read
