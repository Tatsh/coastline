---
concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}
jobs:
  version:
    name: 'Package version'
    outputs:
      version: '${{ steps.version.outputs.version }}'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: 'version'
        name: 'Select the tag or seven-character SHA'
        run: |
          version="${GITHUB_SHA:0:7}"
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            version="v${tag#v}"
            version="${version//\//-}"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
  n64:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'Top Gear Rally (${{ matrix.region_name }})'
    needs: 'version'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ['us', 'jp', 'eu', 'asia']
        include:
          - region: 'us'
            region_name: 'US'
          - region: 'jp'
            region_name: 'Japan'
          - region: 'eu'
            region_name: 'Europe'
          - region: 'asia'
            region_name: 'Asia'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The compiler is libdragon's GCC. No other part of libdragon is used, and the package is
      # pinned by digest.
      - name: 'Install the toolchain'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o gcc-toolchain-mips64-x86_64.deb \
            https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          echo 'fac8e6572493a66468b7d45df41b042f90b1a630ec96aa218bd5fb1f320a0a4d  gcc-toolchain-mips64-x86_64.deb' \
            | sha256sum -c
          sudo apt-get install -y ./gcc-toolchain-mips64-x86_64.deb
      - name: 'Toolchain versions'
        run: |
          /opt/libdragon/bin/mips64-elf-gcc --version
          cmake --version
      - name: 'Configure'
        run: >-
          cmake --preset "tgr-$TGR_REGION" -DCMAKE_BUILD_TYPE=Release
          -DTGR_ENABLE_PATCHES=ON -DTGR_DEBUG_SYMBOLS=ON
        env:
          N64_INST: '/opt/libdragon'
          TGR_REGION: '${{ matrix.region }}'
      - name: 'Compile'
        run: cmake --build --preset "tgr-$TGR_REGION" -- -k 0
        env:
          TGR_REGION: '${{ matrix.region }}'
      # The ELF links without ROM assets and retains addresses for GDB.
      - name: 'Save the N64 symbols'
        run: |
          cp "build/tgr-$TGR_REGION/src/coastline" \
            "top-gear-rally-$VERSION-$TGR_REGION.elf"
          /opt/libdragon/bin/mips64-elf-readelf -S \
            "top-gear-rally-$VERSION-$TGR_REGION.elf" | grep -q '.debug_info'
        env:
          TGR_REGION: '${{ matrix.region }}'
          VERSION: '${{ needs.version.outputs.version }}'
      - name: 'Attest the symbols'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'top-gear-rally-*.elf'
      - name: 'Upload the symbols'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'top-gear-rally-${{ needs.version.outputs.version }}-${{ matrix.region }}-symbols'
          path: 'top-gear-rally-*.elf'
  n64-matching:
    name: 'Top Gear Rally matching (${{ matrix.region_name }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ['us', 'jp', 'eu', 'asia']
        include:
          - region: 'us'
            region_name: 'US'
          - region: 'jp'
            region_name: 'Japan'
          - region: 'eu'
            region_name: 'Europe'
          - region: 'asia'
            region_name: 'Asia'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install the toolchains'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o gcc-toolchain-mips64-x86_64.deb \
            https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          echo 'fac8e6572493a66468b7d45df41b042f90b1a630ec96aa218bd5fb1f320a0a4d  gcc-toolchain-mips64-x86_64.deb' \
            | sha256sum -c
          sudo apt-get install -y ./gcc-toolchain-mips64-x86_64.deb
          mkdir -p .wiswa-ci/ido/5.3
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o .wiswa-ci/ido-5.3.tar.gz \
            https://github.com/decompals/ido-static-recomp/releases/download/v1.2/ido-5.3-recomp-linux.tar.gz
          echo 'ab5c741561f80913d58c8b074771f23941a3edd312505a8ebed6d1dfeb65e506  .wiswa-ci/ido-5.3.tar.gz' \
            | sha256sum -c
          tar -xf .wiswa-ci/ido-5.3.tar.gz -C .wiswa-ci/ido/5.3
      - name: 'Compile and verify the IDO Release code image'
        run: |
          cmake -S . -B ".wiswa-ci/build/ido-$TGR_REGION" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/n64-ido-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DTGR_PLATFORM=n64 -DTGR_REGION="$TGR_REGION" \
            -DTGR_ENABLE_PATCHES=OFF -DIDO_ROOT="$IDO_ROOT"
          cmake --build ".wiswa-ci/build/ido-$TGR_REGION" --target rom --parallel 4 2>&1 \
            | sed -e '/^uopt: Warning: ProcessRacingScreen: this procedure not optimized because it$/d' \
                  -e '/^cc: Warning: -mips3 should not be used for ucode 32-bit compiles$/d'
        env:
          IDO_ROOT: '${{ github.workspace }}/.wiswa-ci/ido/5.3'
          N64_INST: '/opt/libdragon'
          TGR_REGION: '${{ matrix.region }}'
  sdl:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'coastline (${{ matrix.platform.name }})'
    needs: 'version'
    runs-on: '${{ matrix.platform.os }}'
    strategy:
      fail-fast: false
      matrix:
        platform:
          # linuxdeploy builds the AppImage, and its checksum is that of the pinned release.
          - architecture: 'x86_64'
            artifact_arch: 'x86-64'
            linuxdeploy-sha256: 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d'
            name: 'Linux x86-64'
            os: 'ubuntu-latest'
            slug: 'linux-x86-64'
          - architecture: 'arm64'
            artifact_arch: 'aarch64'
            linuxdeploy-sha256: '620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff'
            name: 'Linux aarch64'
            os: 'ubuntu-24.04-arm'
            slug: 'linux-aarch64'
          # MSVC of Visual Studio 2022 is the oldest that compiles C++23, and the game targets
          # Windows 7, the oldest SDL 3 runs on.
          - architecture: 'x64'
            artifact_arch: 'x86-64'
            compiler: 'msvc'
            name: 'Windows x86-64'
            os: 'windows-2022'
            slug: 'windows-x86-64'
          - architecture: 'arm64'
            artifact_arch: 'aarch64'
            compiler: 'msvc'
            name: 'Windows aarch64'
            os: 'windows-11-arm'
            slug: 'windows-aarch64'
          - architecture: 'arm64'
            artifact_arch: 'aarch64'
            compiler: 'clang'
            name: 'Windows aarch64 Clang'
            os: 'windows-11-arm'
            slug: 'windows-aarch64-clang'
          # The Apple silicon runner builds both slices, including Intel Macs from macOS 10.15.
          - architecture: 'universal'
            artifact_arch: 'universal'
            name: 'macOS universal'
            os: 'macos-latest'
            slug: 'macos-universal'
    env:
      # Each package filename includes a version tag or the seven-character commit SHA.
      PACKAGE: 'coastline-${{ needs.version.outputs.version }}-${{ matrix.platform.slug }}-Release'
      BUILD_TYPE: 'Release'
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      VCPKG_KEEP_ENV_VARS: 'MACOSX_DEPLOYMENT_TARGET;NASMENV'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.wiswa-ci/vcpkg-cache,readwrite'
      VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Prepare the vcpkg binary cache'
        run: mkdir -p .wiswa-ci/vcpkg-cache
        shell: bash
      - if: github.ref_type != 'tag'
        id: 'vcpkg-cache'
        name: 'Restore vcpkg binaries'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-${{ matrix.platform.slug }}-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      # The vcpkg build of SDL needs the development headers of ALSA, EGL, Wayland, xkbcommon, and
      # the X11 extensions, and autoconf-archive.
      - if: runner.os == 'Linux'
        name: 'Install the tools'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf-archive cmake libasound2-dev libegl1-mesa-dev \
            libltdl-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev nasm ninja-build \
            pkg-config wayland-protocols
      - if: runner.os == 'macOS'
        name: 'Install the tools'
        run: |
          brew install librsvg nasm
          command -v ninja >/dev/null || brew install ninja
      # The baseline of vcpkg-configuration.json pins the versions of the ports.
      # The workflow also builds tags, so the packages vcpkg builds are not cached.
      - name: 'Install vcpkg'
        run: git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
        shell: bash
      - if: runner.os == 'Linux'
        name: 'Configure and compile'
        run: |
          cmake --preset coastline -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCOASTLINE_PORTABLE=ON \
            -DTGR_DEBUG_SYMBOLS=ON \
            -DCOASTLINE_DISCORD=ON '-DVCPKG_MANIFEST_FEATURES=sdl;video'
          cmake --build --preset coastline -- -k 0
      - if: runner.os == 'macOS'
        name: 'Configure and compile'
        run: |
          for architecture in arm64 x86_64; do
            triplet=arm64-osx
            if [[ "$architecture" == x86_64 ]]; then triplet=x64-osx; fi
            cmake --preset coastline -B "build/coastline-$architecture" \
              -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCOASTLINE_PORTABLE=ON \
              -DTGR_DEBUG_SYMBOLS=ON -DCOASTLINE_DISCORD=ON \
              '-DVCPKG_MANIFEST_FEATURES=sdl;video' \
              -DCMAKE_OSX_ARCHITECTURES="$architecture" -DVCPKG_TARGET_TRIPLET="$triplet"
            cmake --build "build/coastline-$architecture" -- -k 0
          done
        env:
          NASMENV: '!--pragma!macho build_version macos,10,15'
      # Ninja finds MSVC in the environment the developer command prompt sets up for the
      # architecture of the runner.
      - if: runner.os == 'Windows'
        name: 'Configure and compile'
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $studio = & $installer -latest -property installationPath
          Import-Module "$studio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $studio -SkipAutomaticLocation `
            -DevCmdArguments "-arch=$env:ARCHITECTURE -host_arch=$env:ARCHITECTURE"
          $compilerArgs = @()
          if ($env:COMPILER -eq 'clang') {
            $clang = (Get-Command clang-cl -ErrorAction Stop).Source
            & $clang --version
            $compilerArgs = @("-DCMAKE_C_COMPILER=$clang", "-DCMAKE_CXX_COMPILER=$clang")
          }
          cmake --preset coastline -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" -DCOASTLINE_PORTABLE=ON `
            -DTGR_DEBUG_SYMBOLS=ON `
            -DCOASTLINE_DISCORD=ON '-DVCPKG_MANIFEST_FEATURES=sdl;video' @compilerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset coastline -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          ARCHITECTURE: '${{ matrix.platform.architecture }}'
          COMPILER: '${{ matrix.platform.compiler }}'
        shell: pwsh
      - if: >-
          !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.vcpkg-cache.outputs.cache-hit != 'true'
        name: 'Save vcpkg binaries'
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-${{ matrix.platform.slug }}-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - if: runner.os == 'macOS'
        name: 'Save macOS symbols'
        run: |
          mkdir symbols
          for architecture in arm64 x86_64; do
            dsymutil "build/coastline-$architecture/src/sdl/Coastline.app/Contents/MacOS/Coastline" \
              -o "symbols/Coastline-$architecture.app.dSYM"
          done
          ditto -c -k symbols "$PACKAGE-symbols.zip"
      - name: 'Install'
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            for architecture in arm64 x86_64; do
              cmake --install "build/coastline-$architecture" \
                --prefix "staging-$architecture" --strip
            done
            ditto staging-arm64 staging
            while IFS= read -r -d '' binary; do
              file "$binary" | grep -q 'Mach-O' || continue
              relative="${binary#staging/}"
              test -f "staging-x86_64/$relative"
              lipo -create "staging-arm64/$relative" "staging-x86_64/$relative" \
                -output "$binary"
              test "$(lipo -archs "$binary")" = 'x86_64 arm64' || \
                test "$(lipo -archs "$binary")" = 'arm64 x86_64'
            done < <(find staging -type f -print0)
            codesign --force --deep --sign - staging/Coastline.app
          elif [[ "$RUNNER_OS" == Linux ]]; then
            cmake --install build/coastline --prefix staging
          else
            cmake --install build/coastline --prefix staging --strip
          fi
        shell: bash
      - if: runner.os == 'Linux'
        name: 'Save Linux symbols'
        run: |
          while IFS= read -r -d '' binary; do
            readelf -h "$binary" >/dev/null 2>&1 || continue
            mkdir -p "symbols/${binary%/*}"
            cp "$binary" "symbols/$binary"
            strip --strip-unneeded "$binary"
          done < <(find staging -type f -print0)
          test -f symbols/staging/bin/coastline
          tar -C symbols -czf "$PACKAGE-symbols.tar.gz" .
      # Each package keeps the permissions of the files, which an artifact loses: a tarball on
      # Linux, and on macOS a disk image, which also keeps the signature of the bundle.
      - if: runner.os == 'Linux'
        name: 'Package'
        run: tar -C staging -czf "$PACKAGE.tar.gz" .
      - if: runner.os == 'macOS'
        name: 'Package'
        run: |
          codesign --verify --deep --strict staging/Coastline.app
          mkdir dmg-root
          ditto staging/Coastline.app dmg-root/Coastline.app
          ln -s /Applications dmg-root/Applications
          mac_package="Coastline-${PACKAGE#coastline-}"
          hdiutil create -volname Coastline -srcfolder dmg-root -ov -format UDZO \
            "$mac_package.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint dmg-check "$mac_package.dmg"
          test -d dmg-check/Coastline.app
          test "$(readlink dmg-check/Applications)" = /Applications
          codesign --verify --deep --strict dmg-check/Coastline.app
          hdiutil detach dmg-check
      - if: runner.os == 'Windows'
        name: 'Verify installed runtime'
        run: |
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            & .\staging\bin\coastline.exe --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:PATH = $originalPath
          }
        shell: pwsh
      - if: runner.os == 'Windows'
        name: 'Package'
        # A relative Unicode link avoids embedding the build runner's staging directory.
        run: |
          $link = [IO.BinaryWriter]::new([IO.File]::Create((Join-Path $PWD 'staging/Coastline.lnk')))
          try {
            $link.Write([uint32]0x4c)
            $link.Write(([Guid]'00021401-0000-0000-C000-000000000046').ToByteArray())
            $link.Write([uint32]0x88)
            $link.Write([uint32]0x20)
            $link.Write([byte[]]::new(28))
            $link.Write([int32]0)
            $link.Write([uint32]1)
            $link.Write([byte[]]::new(12))
            $target = 'bin\coastline.exe'
            $link.Write([uint16]$target.Length)
            $link.Write([Text.Encoding]::Unicode.GetBytes($target))
            $link.Write([uint32]0)
          } finally {
            $link.Dispose()
          }
          Compress-Archive -Path staging\* -DestinationPath "$env:PACKAGE.zip"
          $pdb = 'build/coastline/src/sdl/coastline.pdb'
          if (-not (Test-Path $pdb)) { throw "Missing $pdb" }
          Compress-Archive -Path $pdb -DestinationPath "$env:PACKAGE-symbols.zip"
        shell: pwsh
      # NSIS is on the x64 runner but not always on the arm64 runner.
      - if: runner.os == 'Windows'
        name: 'Build the installer'
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          $env:PATH = "$nsis;$env:PATH"
          cpack --config build/coastline/CPackConfig.cmake -B . `
            -D "CPACK_PACKAGE_FILE_NAME=$env:PACKAGE-setup"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: 'Attest the game packages'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            Coastline-*.dmg
            coastline-*.exe
            coastline-*.tar.gz
            coastline-*.zip
      - name: 'Upload the game'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-${{ needs.version.outputs.version }}-${{ matrix.platform.slug }}-Release'
          path: |
            Coastline-${{ needs.version.outputs.version }}-${{ matrix.platform.slug }}-Release.dmg
            ${{ env.PACKAGE }}.exe
            ${{ env.PACKAGE }}-setup.exe
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}-symbols.tar.gz
            ${{ env.PACKAGE }}-symbols.zip
      # The AppImage bundles the libraries the game links, and SDL opens those of the system for
      # the display, the GPU, and the sound.
      - if: runner.os == 'Linux'
        name: 'Build the AppImage'
        run: |
          arch="$(uname -m)"
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$arch.AppImage"
          echo "$LINUXDEPLOY_SHA256  linuxdeploy.AppImage" | sha256sum -c
          chmod +x linuxdeploy.AppImage
          DESTDIR=AppDir cmake --install build/coastline --prefix /usr --strip
          appstreamcli validate --no-net \
            AppDir/usr/share/metainfo/sh.tat.coastline.metainfo.xml
          cp AppDir/usr/share/metainfo/sh.tat.coastline.metainfo.xml \
            AppDir/usr/share/metainfo/sh.tat.coastline.appdata.xml
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage --appdir AppDir \
            --desktop-file=AppDir/usr/share/applications/sh.tat.coastline.desktop --output appimage
          cp "$PACKAGE-symbols.tar.gz" \
            "coastline-$VERSION-appimage-$ARTIFACT_ARCH-Release-symbols.tar.gz"
        env:
          ARTIFACT_ARCH: '${{ matrix.platform.artifact_arch }}'
          LDAI_OUTPUT: 'coastline-${{ needs.version.outputs.version }}-appimage-${{ matrix.platform.artifact_arch }}-Release.AppImage'
          LDAI_NO_APPSTREAM: '1'
          LINUXDEPLOY_OUTPUT_VERSION: '${{ needs.version.outputs.version }}'
          LINUXDEPLOY_SHA256: '${{ matrix.platform.linuxdeploy-sha256 }}'
          VERSION: '${{ needs.version.outputs.version }}'
      - if: runner.os == 'Linux' && github.event_name != 'pull_request'
        name: 'Attest the AppImage'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'coastline-${{ needs.version.outputs.version }}-appimage-${{ matrix.platform.artifact_arch }}-Release.AppImage'
      - if: runner.os == 'Linux'
        name: 'Upload the AppImage'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-${{ needs.version.outputs.version }}-appimage-${{ matrix.platform.artifact_arch }}-Release'
          path: |
            coastline-${{ needs.version.outputs.version }}-appimage-${{ matrix.platform.artifact_arch }}-Release.AppImage
            coastline-${{ needs.version.outputs.version }}-appimage-${{ matrix.platform.artifact_arch }}-Release-symbols.tar.gz
  flatpak:
    env:
      NODE_OPTIONS: '--no-deprecation'
    permissions:
      attestations: write
      contents: read
      id-token: write
    container:
      image: 'ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08@sha256:c91a88269eee8fcdd73ecf43064232fbebe27411f926f63f38bdf70c51f2ceae'
      options: '--privileged'
    name: 'coastline Flatpak (${{ matrix.artifact_arch }})'
    needs: 'version'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'x86_64'
            artifact_arch: 'x86-64'
            os: 'ubuntu-latest'
          - arch: 'aarch64'
            artifact_arch: 'aarch64'
            os: 'ubuntu-24.04-arm'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3'
        with:
          arch: '${{ matrix.arch }}'
          build-debug-bundle: true
          bundle: 'coastline-${{ needs.version.outputs.version }}-flatpak-${{ matrix.artifact_arch }}-Release.flatpak'
          cache: false
          manifest-path: 'sh.tat.coastline.yml'
          upload-artifact: false
      - name: 'Verify the Flatpak symbols'
        env:
          SYMBOLS_FILE: 'coastline-${{ needs.version.outputs.version }}-flatpak-${{ matrix.artifact_arch }}-Release-debug.flatpak'
        run: test -f "$SYMBOLS_FILE"
      - name: 'Attest the Flatpak'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'coastline-${{ needs.version.outputs.version }}-flatpak-${{ matrix.artifact_arch }}-Release*.flatpak'
      - name: 'Upload the Flatpak'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-${{ needs.version.outputs.version }}-flatpak-${{ matrix.artifact_arch }}-Release'
          path: |
            coastline-${{ needs.version.outputs.version }}-flatpak-${{ matrix.artifact_arch }}-Release.flatpak
            coastline-${{ needs.version.outputs.version }}-flatpak-${{ matrix.artifact_arch }}-Release-debug.flatpak
  snap:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'coastline Snap (${{ matrix.artifact_arch }})'
    needs: 'version'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: 'x86-64'
            name: 'amd64'
            os: 'ubuntu-latest'
          - artifact_arch: 'aarch64'
            name: 'arm64'
            os: 'ubuntu-24.04-arm'
    steps:
      # The version of the snap is the description of the commit by its tags.
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Build the snap'
        run: |
          if [[ ! -x /usr/bin/snap ]]; then
            sudo apt-get update -q
            sudo apt-get install -qy snapd
          fi
          if [[ "$(stat -c '%u:%g' /)" != '0:0' ]]; then
            sudo chown root:root /
          fi
          sudo groupadd --force --system lxd
          sudo usermod --append --groups lxd "$USER"
          if [[ -x /snap/bin/lxd ]]; then
            sudo snap refresh lxd || true
          else
            sudo snap install lxd
          fi
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          if [[ -x /snap/bin/snapcraft ]]; then
            sudo snap refresh --channel stable --classic snapcraft
          else
            sudo snap install --channel stable --classic snapcraft
          fi
          sudo -u "$USER" -E snapcraft
        env:
          SNAPCRAFT_BUILD_ENVIRONMENT: 'lxd'
          SNAPCRAFT_BUILD_INFO: '1'
          SNAPCRAFT_IMAGE_INFO: >-
            {"build_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
      - name: 'Version the snap filename'
        run: |
          shopt -s nullglob
          snaps=(*.snap)
          [[ ${#snaps[@]} -eq 1 ]]
          name="coastline-${VERSION}-snap-${ARTIFACT_ARCH}-Release.snap"
          [[ "${snaps[0]}" == "$name" ]] || mv -- "${snaps[0]}" "$name"
          echo "SNAP_FILE=$name" >> "$GITHUB_ENV"
        env:
          ARTIFACT_ARCH: '${{ matrix.artifact_arch }}'
          VERSION: '${{ needs.version.outputs.version }}'
      - name: 'Save the snap symbols'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          mkdir -p .wiswa-ci
          unsquashfs -no-progress -d .wiswa-ci/snap-symbols "$SNAP_FILE" usr/bin/coastline
          readelf --debug-dump=info .wiswa-ci/snap-symbols/usr/bin/coastline \
            | grep -q 'DW_AT_comp_dir'
          tar -C .wiswa-ci/snap-symbols -czf \
            "coastline-$VERSION-snap-$ARTIFACT_ARCH-symbols.tar.gz" usr/bin/coastline
        env:
          ARTIFACT_ARCH: '${{ matrix.artifact_arch }}'
          VERSION: '${{ needs.version.outputs.version }}'
      - name: 'Attest the snap'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            ${{ env.SNAP_FILE }}
            coastline-${{ needs.version.outputs.version }}-snap-${{ matrix.artifact_arch }}-symbols.tar.gz
      - name: 'Upload the snap'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-${{ needs.version.outputs.version }}-snap-${{ matrix.artifact_arch }}-Release'
          path: |
            ${{ env.SNAP_FILE }}
            coastline-${{ needs.version.outputs.version }}-snap-${{ matrix.artifact_arch }}-symbols.tar.gz
  sdl-mingw:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'coastline (Windows x86-64 MinGW)'
    needs: 'version'
    runs-on: windows-2022
    env:
      PACKAGE: 'coastline-${{ needs.version.outputs.version }}-windows-x86-64-mingw-Release'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.wiswa-ci/vcpkg-cache,readwrite'
      VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
    steps:
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'git zip'
          msystem: 'ucrt64'
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Prepare the vcpkg binary cache'
        run: mkdir -p .wiswa-ci/vcpkg-cache
        shell: 'msys2 {0}'
      - if: github.ref_type != 'tag'
        id: 'vcpkg-cache'
        name: 'Restore vcpkg binaries'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-windows-x64-ucrt-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Configure and compile'
        run: |
          git clone https://github.com/microsoft/vcpkg .vcpkg
          cmake --preset coastline -DCMAKE_BUILD_TYPE=Release -DCOASTLINE_PORTABLE=ON \
            -DTGR_DEBUG_SYMBOLS=ON \
            -DCOASTLINE_VIDEO=OFF -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic \
            -DVCPKG_HOST_TRIPLET=x64-mingw-dynamic \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          cmake --build --preset coastline -- -k 0
        shell: 'msys2 {0}'
      - if: >-
          !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.vcpkg-cache.outputs.cache-hit != 'true'
        name: 'Save vcpkg binaries'
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-windows-x64-ucrt-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Package'
        run: |
          cmake --install build/coastline --prefix staging
          ./staging/bin/coastline.exe --help
          mkdir -p symbols
          find staging -type f \( -name '*.exe' -o -name '*.dll' \) -print0 \
            | while IFS= read -r -d '' binary; do
                cp "$binary" "symbols/${binary##*/}"
                strip --strip-unneeded "$binary"
              done
          objdump -h symbols/coastline.exe | grep -q '.debug_info'
          cd staging
          zip -r -9 "../$PACKAGE.zip" .
          cd ../symbols
          zip -r -9 "../$PACKAGE-symbols.zip" .
        shell: 'msys2 {0}'
      - name: 'Attest the game package'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: '${{ env.PACKAGE }}.zip'
      - name: 'Upload the game'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'coastline-${{ needs.version.outputs.version }}-windows-x86-64-mingw-Release'
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}-symbols.zip
  win:
    permissions:
      attestations: write
      contents: read
      id-token: write
    name: 'Boss Rally (MinGW)'
    needs: 'version'
    runs-on: windows-latest
    steps:
      # The compiler is the i686 mingw-w64 GCC of MSYS2's mingw32 system.
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'git zip'
          msystem: 'mingw32'
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p
          suppress-deprecation-warnings: 'msystem-mingw32'
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Toolchain versions'
        run: |
          i686-w64-mingw32-gcc --version
          cmake --version
        shell: 'msys2 {0}'
      - name: 'Install NSIS'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
      - name: 'Configure'
        run: cmake --preset boss-rally -DTGR_ENABLE_PATCHES=ON -DTGR_DEBUG_SYMBOLS=ON
        shell: 'msys2 {0}'
      - name: 'Compile'
        run: cmake --build --preset boss-rally -- -k 0
        shell: 'msys2 {0}'
      # The renderer library, earpds.dll, and the launchers go side by side, as in the installed
      # game.
      - name: 'Package'
        run: |
          mkdir staging
          cp build/boss-rally/win-d3d/src/BRD3D.dll \
            build/boss-rally/win-glide/src/BRGlide.dll \
            build/boss-rally/win-d3d/src/win32/ear/earpds.dll \
            build/boss-rally/win-d3d/src/win32/boot/*.exe staging/
          (cd staging && zip -9 "../boss-rally-$VERSION-windows-x86-symbols.zip" ./*)
          objdump -h staging/BRD3D.dll | grep -q '.debug_info'
          strip --strip-unneeded staging/*.{dll,exe}
          (cd staging && zip -9 "../boss-rally-$VERSION-windows-x86-Release.zip" ./*)
          cp build/boss-rally/BossRally-Setup.exe \
            "boss-rally-$VERSION-windows-x86-setup.exe"
          unzip -l "boss-rally-$VERSION-windows-x86-Release.zip"
        env:
          VERSION: '${{ needs.version.outputs.version }}'
        shell: 'msys2 {0}'
      - name: 'Attest the binaries'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            boss-rally-*.zip
            boss-rally-*-setup.exe
      - name: 'Upload the binaries'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'boss-rally-${{ needs.version.outputs.version }}-windows-x86-Release'
          path: |
            boss-rally-${{ needs.version.outputs.version }}-windows-x86-Release.zip
            boss-rally-${{ needs.version.outputs.version }}-windows-x86-setup.exe
            boss-rally-${{ needs.version.outputs.version }}-windows-x86-symbols.zip
  win-msvc:
    name: 'Boss Rally (MSVC)'
    needs: 'version'
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: windows-2022
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          repository: 'NovaRain/DXSDK_Collection'
          ref: '61827822ad945fac5acb3123ab00c378654bfcd7'
          path: 'dxsdk'
          sparse-checkout: |
            DXSDK_Aug2007/Include
            DXSDK_Aug2007/Lib/x86
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 'Install the resource compiler'
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --noconfirm mingw-w64-i686-binutils'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw32\bin'
      - name: 'Install NSIS'
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
      - name: 'Configure'
        run: >-
          cmake -S . -B build/win-msvc -G 'Visual Studio 17 2022' -A Win32
          -DTGR_VARIANTS=boss-rally -DTGR_ENABLE_PATCHES=ON -DTGR_DEBUG_SYMBOLS=ON
          "-DDXSDK_DIR=$env:GITHUB_WORKSPACE/dxsdk/DXSDK_Aug2007"
      - name: 'Compile'
        run: cmake --build build/win-msvc --config Release --parallel 4
      - name: 'Package the binaries and symbols'
        run: |
          New-Item -ItemType Directory staging, symbols | Out-Null
          $d3d = 'build/win-msvc/win-d3d/src'
          $glide = 'build/win-msvc/win-glide/src'
          $files = @(
            "$d3d/Release/BRD3D.dll",
            "$glide/Release/BRGlide.dll",
            "$d3d/win32/ear/Release/earpds.dll",
            "$d3d/win32/boot/Release/BRally.exe",
            "$d3d/win32/boot/Release/BossRally.exe",
            "$d3d/win32/boot/Release/SetVideo.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing $file" }
            Copy-Item $file staging/
          }
          $pdbs = Get-ChildItem build/win-msvc -Recurse -Filter '*.pdb'
          if (-not $pdbs) { throw 'Missing Boss Rally PDB files' }
          foreach ($pdb in $pdbs) {
            $relative = $pdb.FullName.Substring((Resolve-Path build/win-msvc).Path.Length + 1)
            $destination = Join-Path symbols $relative
            New-Item -ItemType Directory (Split-Path $destination) -Force | Out-Null
            Copy-Item $pdb.FullName $destination
          }
          $stem = "boss-rally-${env:VERSION}-windows-x86-msvc"
          Compress-Archive -Path staging/* -DestinationPath "$stem-Release.zip"
          Compress-Archive -Path symbols/* -DestinationPath "$stem-symbols.zip"
        env:
          VERSION: '${{ needs.version.outputs.version }}'
      - name: 'Attest the MSVC binaries and symbols'
        if: github.event_name != 'pull_request'
        uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: 'boss-rally-*-windows-x86-msvc-*.zip'
      - name: 'Upload the MSVC binaries'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9'
        with:
          if-no-files-found: 'error'
          name: 'boss-rally-${{ needs.version.outputs.version }}-windows-x86-msvc-Release'
          path: |
            boss-rally-${{ needs.version.outputs.version }}-windows-x86-msvc-Release.zip
            boss-rally-${{ needs.version.outputs.version }}-windows-x86-msvc-symbols.zip
  # On a tag, packages and symbols go to the draft. N64 ROMs remain on the CI run.
  # The Release workflow publishes the draft once every workflow of the commit succeeds.
  release:
    if: "github.ref_type == 'tag'"
    name: 'Attach to the release'
    needs: ['flatpak', 'n64', 'sdl', 'sdl-mingw', 'snap', 'win', 'win-msvc']
    permissions:
      attestations: 'write'
      contents: 'write'
      id-token: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333'
        with:
          merge-multiple: true
          path: 'packages'
          pattern: >-
            {coastline-*-{linux,windows,macos,appimage,flatpak,snap}-*-Release,boss-rally-*-windows-x86*-Release}
      - name: 'List the packages'
        run: |
          find packages -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \
            -o -name '*.flatpak' -o -name '*.snap' -o -name '*.tar.gz' \
            -o -name '*.zip' \) \
            | sort > packages.txt
          cat packages.txt
      - uses: 'actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8'
        with:
          subject-path: |
            packages/*.AppImage
            packages/*.dmg
            packages/*.exe
            packages/*.flatpak
            packages/*.snap
            packages/*.tar.gz
            packages/*.zip
      - env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        name: 'Upload to the draft release'
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --notes '' --title "$TAG" --verify-tag
          xargs -d '\n' gh release upload "$TAG" --clobber < packages.txt
name: 'Build'
'on':
  push:
    branches: ['master']
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ['master']
permissions:
  contents: read
