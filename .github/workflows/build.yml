---
concurrency:
  cancel-in-progress: true
  group: build-${{ github.ref }}
jobs:
  n64:
    name: 'Nintendo 64 (${{ matrix.region }}, ${{ matrix.build-type }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ['Debug', 'Release']
        region: ['us', 'jp', 'eu']
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The compiler is libdragon's GCC. No other part of libdragon is used, and the package is
      # pinned by digest.
      - name: 'Install the toolchain'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
          curl -sSL -o gcc-toolchain-mips64-x86_64.deb \
            https://github.com/DragonMinded/libdragon/releases/download/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb
          echo 'fac8e6572493a66468b7d45df41b042f90b1a630ec96aa218bd5fb1f320a0a4d  gcc-toolchain-mips64-x86_64.deb' \
            | sha256sum -c
          sudo apt-get install -y ./gcc-toolchain-mips64-x86_64.deb
      - name: 'Toolchain versions'
        run: |
          /opt/libdragon/bin/mips64-elf-gcc --version
          cmake --version
      - name: 'Configure'
        run: cmake --preset "n64-$TGR_REGION" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DTGR_ENABLE_PATCHES=ON
        env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          N64_INST: '/opt/libdragon'
          TGR_REGION: '${{ matrix.region }}'
      - name: 'Compile'
        run: cmake --build --preset "n64-$TGR_REGION" -- -k 0
        env:
          TGR_REGION: '${{ matrix.region }}'
  sdl:
    name: 'SDL (${{ matrix.name }})'
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Linux x86_64'
            os: 'ubuntu-latest'
          - name: 'Linux arm64'
            os: 'ubuntu-24.04-arm'
          # MSVC of Visual Studio 2022 is the oldest that compiles C++23, and the game targets
          # Windows 7, the oldest SDL 3 runs on.
          - architecture: 'x64'
            name: 'Windows x64'
            os: 'windows-2022'
          - architecture: 'arm64'
            name: 'Windows arm64'
            os: 'windows-11-arm'
          # The Apple silicon runner also builds for Intel Macs, from 10.15, the oldest macOS
          # whose C++ library has std::filesystem.
          - architecture: 'arm64'
            name: 'macOS arm64'
            os: 'macos-latest'
            triplet: 'arm64-osx'
          - architecture: 'x86_64'
            name: 'macOS x86_64'
            os: 'macos-latest'
            triplet: 'x64-osx'
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      VCPKG_KEEP_ENV_VARS: 'MACOSX_DEPLOYMENT_TARGET'
      VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      # The vcpkg build of SDL needs the development headers of ALSA, EGL, Wayland, xkbcommon, and
      # the X11 extensions, and autoconf-archive.
      - if: runner.os == 'Linux'
        name: 'Install the tools'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf-archive cmake libasound2-dev libegl1-mesa-dev \
            libltdl-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev ninja-build \
            pkg-config wayland-protocols
      - if: runner.os == 'macOS'
        name: 'Install the tools'
        run: brew install ninja
      # The baseline of vcpkg-configuration.json pins the versions of the ports.
      # The workflow also builds tags, so the packages vcpkg builds are not cached.
      - name: 'Install vcpkg'
        run: git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
        shell: bash
      - if: runner.os == 'Linux'
        name: 'Configure and compile'
        run: |
          cmake --preset sdl
          cmake --build --preset sdl -- -k 0
      - if: runner.os == 'macOS'
        name: 'Configure and compile'
        run: |
          cmake --preset sdl -DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURE" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET"
          cmake --build --preset sdl -- -k 0
        env:
          ARCHITECTURE: '${{ matrix.architecture }}'
          TRIPLET: '${{ matrix.triplet }}'
      # Ninja finds MSVC in the environment the developer command prompt sets up for the
      # architecture of the runner.
      - if: runner.os == 'Windows'
        name: 'Configure and compile'
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $studio = & $installer -latest -property installationPath
          Import-Module "$studio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $studio -SkipAutomaticLocation `
            -DevCmdArguments "-arch=$env:ARCHITECTURE -host_arch=$env:ARCHITECTURE"
          cmake --preset sdl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset sdl -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          ARCHITECTURE: '${{ matrix.architecture }}'
        shell: pwsh
  win:
    name: 'Windows (${{ matrix.renderer }}, ${{ matrix.build-type }})'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: ['Debug', 'Release']
        renderer: ['d3d', 'glide']
    steps:
      # The compiler is the i686 mingw-w64 GCC of MSYS2's mingw32 system.
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'git'
          msystem: 'mingw32'
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p
          update: true
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Toolchain versions'
        run: |
          i686-w64-mingw32-gcc --version
          cmake --version
        shell: 'msys2 {0}'
      - name: 'Configure'
        run: cmake --preset "win-$TGR_RENDERER" -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DTGR_ENABLE_PATCHES=ON
        env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          TGR_RENDERER: '${{ matrix.renderer }}'
        shell: 'msys2 {0}'
      - name: 'Compile'
        run: cmake --build --preset "win-$TGR_RENDERER" -- -k 0
        env:
          TGR_RENDERER: '${{ matrix.renderer }}'
        shell: 'msys2 {0}'
name: 'Build'
'on':
  push:
    branches: ['master']
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ['master']
permissions:
  contents: read
