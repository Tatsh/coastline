---
concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.ref }}'
env:
  CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: 'false'
  VCPKG_OVERLAY_TRIPLETS: '${{ github.workspace }}/cmake/vcpkg-triplets'
jobs:
  analyze:
    name: '${{ matrix.job_name }}'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out the repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          build-mode: '${{ matrix.build-mode }}'
          languages: '${{ matrix.language }}'
      - if: matrix.language == 'c-cpp'
        name: 'Prepare the vcpkg binary cache'
        run: mkdir -p .wiswa-ci/vcpkg-cache
      - if: matrix.language == 'c-cpp' && github.ref_type != 'tag'
        id: 'vcpkg-cache'
        name: 'Restore vcpkg binaries'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-linux-x86_64-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - if: matrix.language == 'c-cpp'
        name: 'Build the SDL game for analysis'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf-archive cmake libasound2-dev libavcodec-dev \
            libavformat-dev libavutil-dev libegl1-mesa-dev libltdl-dev libswresample-dev \
            libswscale-dev libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev nasm ninja-build \
            pkg-config wayland-protocols
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          cmake --preset coastline -DCMAKE_BUILD_TYPE=Release -DCOASTLINE_PORTABLE=ON \
            -DCOASTLINE_DISCORD=ON '-DVCPKG_MANIFEST_FEATURES=sdl;video'
          cmake --build --preset coastline -- -k 0
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.wiswa-ci/vcpkg-cache,readwrite'
          VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
      - if: >-
          !cancelled() && matrix.language == 'c-cpp' && github.event_name == 'push' &&
          github.ref == 'refs/heads/master' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        name: 'Save vcpkg binaries'
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-linux-x86_64-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Analyze'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
          category: '/language:${{ matrix.language }}'
      - if: matrix.language == 'c-cpp' || matrix.language == 'cpp'
        name: Restrict native findings to project sources
        run: python3 .github/scripts/static-analysis.py --sarif "$RUNNER_TEMP/codeql-sarif"
      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{ matrix.language }}
          sarif_file: ${{ runner.temp }}/codeql-sarif
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-mode: manual
            job_name: 'Analyze coastline (Linux x86-64)'
            language: c-cpp
          - build-mode: none
            job_name: 'Analyze (actions)'
            language: actions
  analyze-sdl:
    name: 'Analyze coastline (${{ matrix.platform.name }})'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: '${{ matrix.platform.os }}'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: 'arm64'
            name: 'macOS aarch64'
            os: 'macos-latest'
            slug: 'macos-aarch64'
            triplet: 'arm64-osx'
          - arch: 'x64'
            name: 'Windows x86-64'
            os: 'windows-2022'
            slug: 'windows-x86-64'
            triplet: 'x64-windows'
    env:
      CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: 'false'
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.wiswa-ci/vcpkg-cache,readwrite'
      VCPKG_KEEP_ENV_VARS: 'MACOSX_DEPLOYMENT_TARGET;NASMENV'
      VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Prepare the vcpkg binary cache'
        run: mkdir -p .wiswa-ci/vcpkg-cache
        shell: bash
      - if: github.ref_type != 'tag'
        id: 'vcpkg-cache'
        name: 'Restore vcpkg binaries'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-${{ matrix.platform.slug }}-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - if: runner.os == 'macOS'
        name: 'Install macOS tools'
        run: |
          brew install librsvg nasm
          command -v ninja >/dev/null || brew install ninja
      - name: 'Install vcpkg'
        run: git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
        shell: bash
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          build-mode: 'manual'
          languages: 'c-cpp'
      - if: runner.os == 'macOS'
        name: 'Build coastline for analysis'
        run: |
          cmake --preset coastline -DCMAKE_BUILD_TYPE=Release -DCOASTLINE_PORTABLE=ON \
            -DCOASTLINE_DISCORD=ON '-DVCPKG_MANIFEST_FEATURES=sdl' \
            -DCMAKE_OSX_ARCHITECTURES="$ARCHITECTURE" -DVCPKG_TARGET_TRIPLET="$TRIPLET"
          cmake --build --preset coastline -- -k 0
        env:
          ARCHITECTURE: '${{ matrix.platform.arch }}'
          NASMENV: '!--pragma!macho build_version macos,10,15'
          TRIPLET: '${{ matrix.platform.triplet }}'
      - if: runner.os == 'Windows'
        name: 'Build coastline for analysis'
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $studio = & $installer -latest -property installationPath
          Import-Module "$studio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $studio -SkipAutomaticLocation `
            -DevCmdArguments "-arch=$env:ARCHITECTURE -host_arch=x64"
          cmake --preset coastline -DCMAKE_BUILD_TYPE=Release -DCOASTLINE_PORTABLE=ON `
            -DCOASTLINE_DISCORD=ON '-DVCPKG_MANIFEST_FEATURES=sdl' `
            "-DVCPKG_TARGET_TRIPLET=$env:TRIPLET"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset coastline -- -k 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          ARCHITECTURE: '${{ matrix.platform.arch }}'
          TRIPLET: '${{ matrix.platform.triplet }}'
        shell: pwsh
      - if: >-
          !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.vcpkg-cache.outputs.cache-hit != 'true'
        name: 'Save vcpkg binaries'
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-${{ matrix.platform.slug }}-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Analyze'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/sdl-${{ matrix.platform.slug }}'
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
      - if: runner.os == 'macOS'
        name: 'Restrict native findings to project sources'
        run: python3 .github/scripts/static-analysis.py --sarif "$RUNNER_TEMP/codeql-sarif"
      - if: runner.os == 'Windows'
        name: 'Restrict native findings to project sources'
        run: python .github/scripts/static-analysis.py --sarif "$env:RUNNER_TEMP/codeql-sarif"
        shell: pwsh
      - name: 'Upload CodeQL results'
        uses: 'github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/sdl-${{ matrix.platform.slug }}'
          sarif_file: '${{ runner.temp }}/codeql-sarif'
  analyze-sdl-mingw:
    name: 'Analyze coastline (Windows x86-64 MinGW)'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.wiswa-ci/vcpkg-cache,readwrite'
      VCPKG_ROOT: '${{ github.workspace }}/.vcpkg'
    steps:
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'git zip'
          msystem: 'ucrt64'
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Prepare the vcpkg binary cache'
        run: mkdir -p .wiswa-ci/vcpkg-cache
        shell: 'msys2 {0}'
      - if: github.ref_type != 'tag'
        id: 'vcpkg-cache'
        name: 'Restore vcpkg binaries'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-windows-x64-ucrt-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Install vcpkg'
        run: git clone https://github.com/microsoft/vcpkg .vcpkg
        shell: 'msys2 {0}'
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          build-mode: 'manual'
          languages: 'c-cpp'
      - name: 'Build coastline for analysis'
        run: |
          cmake --preset coastline -DCMAKE_BUILD_TYPE=Release -DCOASTLINE_PORTABLE=ON \
            -DCOASTLINE_VIDEO=OFF -DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic \
            -DVCPKG_HOST_TRIPLET=x64-mingw-dynamic \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          cmake --build --preset coastline -- -k 0
        shell: 'msys2 {0}'
      - if: >-
          !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.vcpkg-cache.outputs.cache-hit != 'true'
        name: 'Save vcpkg binaries'
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: "vcpkg-${{ runner.os }}-windows-x64-ucrt-${{ hashFiles('vcpkg.json') }}"
          path: '.wiswa-ci/vcpkg-cache'
      - name: 'Analyze'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/sdl-windows-x86-64-mingw'
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
      - name: 'Restrict native findings to project sources'
        run: python .github/scripts/static-analysis.py --sarif "$env:RUNNER_TEMP/codeql-sarif"
        shell: pwsh
      - name: 'Upload CodeQL results'
        uses: 'github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/sdl-windows-x86-64-mingw'
          sarif_file: '${{ runner.temp }}/codeql-sarif'
  analyze-n64:
    name: 'Analyze Top Gear Rally (${{ matrix.region_name }})'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ['us', 'jp', 'eu', 'asia']
        include:
          - region: 'us'
            region_name: 'US'
          - region: 'jp'
            region_name: 'Japan'
          - region: 'eu'
            region_name: 'Europe'
          - region: 'asia'
            region_name: 'Asia'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - id: 'toolchain-cache'
        name: 'Restore N64 compiler download'
        uses: 'actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: 'codeql-n64-toolchain-fac8e6572493a664'
          path: '.wiswa-ci/gcc-toolchain-mips64-x86_64.deb'
      - name: 'Install the N64 compiler'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zlib1g-dev
          base='https://github.com/DragonMinded/libdragon/releases/download'
          if [ ! -f .wiswa-ci/gcc-toolchain-mips64-x86_64.deb ]; then
            mkdir -p .wiswa-ci
            curl -sSL -o .wiswa-ci/gcc-toolchain-mips64-x86_64.deb \
              "$base/toolchain-continuous-prerelease/gcc-toolchain-mips64-x86_64.deb"
          fi
          hash='fac8e6572493a66468b7d45df41b042f90b1a630ec96aa218bd5fb1f320a0a4d'
          echo "$hash  .wiswa-ci/gcc-toolchain-mips64-x86_64.deb" | sha256sum -c
          sudo apt-get install -y ./.wiswa-ci/gcc-toolchain-mips64-x86_64.deb
      - if: >-
          matrix.region == 'us' && github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          steps.toolchain-cache.outputs.cache-hit != 'true'
        name: 'Save N64 compiler download'
        uses: 'actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9'
        with:
          key: 'codeql-n64-toolchain-fac8e6572493a664'
          path: '.wiswa-ci/gcc-toolchain-mips64-x86_64.deb'
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          build-mode: 'manual'
          languages: 'c-cpp'
      - name: 'Build unpatched and patched configurations'
        run: |
          for configuration in unpatched patched; do
            case "$configuration" in
              unpatched) patches=OFF ;;
              patched) patches=ON ;;
            esac
            build_dir=".wiswa-ci/build/codeql-n64-$TGR_REGION-$configuration"
            cmake -S . -B "$build_dir" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/n64-toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release -DTGR_PLATFORM=n64 -DTGR_REGION="$TGR_REGION" \
              -DTGR_ENABLE_PATCHES="$patches"
            cmake --build "$build_dir" -- -k 0
          done
        env:
          N64_INST: '/opt/libdragon'
          TGR_REGION: '${{ matrix.region }}'
      - name: 'Analyze'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/n64-${{ matrix.region }}'
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
      - name: Restrict native findings to project sources
        run: python3 .github/scripts/static-analysis.py --sarif "$RUNNER_TEMP/codeql-sarif"
      - name: 'Upload CodeQL results'
        uses: 'github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/n64-${{ matrix.region }}'
          sarif_file: '${{ runner.temp }}/codeql-sarif'
  analyze-win:
    name: 'Analyze Boss Rally (MinGW)'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: windows-2022
    steps:
      - uses: 'msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e'
        with:
          install: 'git zip'
          msystem: 'mingw32'
          pacboy: >-
            cmake:p
            ninja:p
            toolchain:p
          suppress-deprecation-warnings: 'msystem-mingw32'
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Install NSIS'
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          build-mode: 'manual'
          languages: 'c-cpp'
      - name: 'Build patched and unpatched configurations'
        run: |
          for patches in OFF ON; do
            build_dir=".wiswa-ci/build/codeql-win-$patches"
            cmake -S . -B "$build_dir" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/win-toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release -DTGR_PLATFORM=win \
              -DTGR_VARIANTS=boss-rally \
              -DTGR_ENABLE_PATCHES="$patches"
            cmake --build "$build_dir" -- -k 0
          done
        shell: 'msys2 {0}'
      - name: 'Analyze'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/win'
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
      - name: Restrict native findings to project sources
        run: python .github/scripts/static-analysis.py --sarif "$env:RUNNER_TEMP/codeql-sarif"
        shell: pwsh
      - name: 'Upload CodeQL results'
        uses: 'github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/win'
          sarif_file: '${{ runner.temp }}/codeql-sarif'
  analyze-win-msvc:
    name: 'Analyze Boss Rally (MSVC)'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: windows-2022
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          repository: 'NovaRain/DXSDK_Collection'
          ref: '61827822ad945fac5acb3123ab00c378654bfcd7'
          path: 'dxsdk'
          sparse-checkout: |
            DXSDK_Aug2007/Include
            DXSDK_Aug2007/Lib/x86
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 'Install the resource compiler'
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --noconfirm mingw-w64-i686-binutils'
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw32\bin'
      - name: 'Install NSIS'
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          build-mode: 'manual'
          languages: 'c-cpp'
      - name: 'Build patched and unpatched configurations'
        run: |
          foreach ($patches in @('OFF', 'ON')) {
            $buildDir = ".wiswa-ci/build/codeql-win-msvc-$patches"
            cmake -S . -B $buildDir -G 'Visual Studio 17 2022' -A Win32 `
              -DTGR_VARIANTS=boss-rally "-DTGR_ENABLE_PATCHES=$patches" `
              "-DDXSDK_DIR=$env:GITHUB_WORKSPACE/dxsdk/DXSDK_Aug2007"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $buildDir --config Release --parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 'Analyze'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/win-msvc'
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
      - name: Restrict native findings to project sources
        run: python .github/scripts/static-analysis.py --sarif "$env:RUNNER_TEMP/codeql-sarif"
        shell: pwsh
      - name: 'Upload CodeQL results'
        uses: 'github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          category: '/language:c-cpp/win-msvc'
          sarif_file: '${{ runner.temp }}/codeql-sarif'
name: 'CodeQL'
'on':
  pull_request:
    branches: ['master']
  push:
    branches: ['master']
  schedule:
    - cron: '15 4 * * 3'
permissions: {}
