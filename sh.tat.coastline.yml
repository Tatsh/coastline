app-id: 'sh.tat.coastline'
command: 'coastline'
finish-args:
  - '--device=dri'
  - '--device=input'
  - '--filesystem=/media:ro'
  - '--filesystem=/run/media:ro'
  - '--filesystem=home:ro'
  - '--filesystem=xdg-run/app/com.discordapp.Discord:ro'
  - '--filesystem=xdg-run/discord-ipc-0:ro'
  - '--filesystem=xdg-run/discord-ipc-1:ro'
  - '--filesystem=xdg-run/discord-ipc-2:ro'
  - '--filesystem=xdg-run/discord-ipc-3:ro'
  - '--filesystem=xdg-run/discord-ipc-4:ro'
  - '--filesystem=xdg-run/discord-ipc-5:ro'
  - '--filesystem=xdg-run/discord-ipc-6:ro'
  - '--filesystem=xdg-run/discord-ipc-7:ro'
  - '--filesystem=xdg-run/discord-ipc-8:ro'
  - '--filesystem=xdg-run/discord-ipc-9:ro'
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--socket=pulseaudio'
  - '--socket=wayland'
modules:
  - buildsystem: 'simple'
    build-commands:
      - 'make USE_ASM=No PREFIX=/app install-shared'
    name: 'openh264'
    sources:
      - sha256: '558544ad358283a7ab2930d69a9ceddf913f4a51ee9bf1bfb9e377322af81a69'
        type: 'archive'
        url: 'https://github.com/cisco/openh264/archive/v2.6.0.tar.gz'
  - build-options:
      cflags: '-w'
      cxxflags: '-w'
    buildsystem: 'autotools'
    config-opts:
      - '--disable-debug'
      - '--disable-doc'
      - '--disable-ffmpeg'
      - '--disable-ffplay'
      - '--disable-ffprobe'
      - '--disable-static'
      - '--enable-libopenh264'
      - '--enable-shared'
    name: 'ffmpeg'
    sources:
      - mirror-urls:
          - 'https://distfiles.gentoo.org/distfiles/54/ffmpeg-7.1.5.tar.xz'
        sha256: 'de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f'
        type: 'archive'
        url: 'https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz'
  - buildsystem: 'meson'
    cleanup:
      - '/include'
      - '/lib/pkgconfig'
      - '/lib/libgamemodeauto*'
    config-opts:
      - '-Dwith-examples=false'
      - '-Dwith-pam-renicing=false'
      - '-Dwith-sd-bus-provider=no-daemon'
      - '-Dwith-systemd-group=false'
      - '-Dwith-systemd-user-unit=false'
      - '-Dwith-util=false'
    name: 'gamemode'
    post-install:
      - 'install -Dm644 ../LICENSE.txt "${FLATPAK_DEST}/share/licenses/gamemode/LICENSE.txt"'
    sources:
      - commit: 'c54d6d4243b0dd0afcb49f2c9836d432da171a2b'
        tag: '1.8.2'
        type: 'git'
        url: 'https://github.com/FeralInteractive/gamemode.git'
      - commands:
          - 'sed -i "s/value: ''true''/value: true/g" meson_options.txt'
        type: 'shell'
  - build-options:
      build-args:
        - '--share=network'
    builddir: true
    buildsystem: 'cmake-ninja'
    config-opts:
      - '-DCMAKE_BUILD_TYPE=Release'
      - '-DCOASTLINE_PORTABLE=ON'
      - '-DCOASTLINE_DISCORD=ON'
      - '-DTGR_DEBUG_SYMBOLS=ON'
      - '-DTGR_ENABLE_PATCHES=ON'
      - '-DTGR_PLATFORM=sdl'
    name: 'coastline'
    sources:
      - tag: 'v0.0.3'
        type: 'git'
        url: 'https://github.com/Tatsh/coastline.git'
runtime: 'org.freedesktop.Platform'
runtime-version: '25.08'
sdk: 'org.freedesktop.Sdk'
